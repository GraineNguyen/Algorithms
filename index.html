<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ứng dụng tương tác khám phá từng chương của sách Grokking Algorithms – Sơ đồ tư duy, Mô phỏng thuật toán, Code mẫu & Quiz.">
  <title>Grokking Algorithms – Interactive Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Aquarium dynamic background -->
  <canvas id="aquarium-canvas"></canvas>
  <div class="aquarium-vignette"></div>

  <div class="app-container">

    <!-- ======= Header ======= -->
    <header>
      <div class="logo-section">
        <h1>📘 Grokking Algorithms</h1>
        <p id="app-subtitle">Interactive Explorer – Khám phá thuật toán từng phần nhỏ</p>
      </div>

      <div class="header-controls">
        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
          <button class="nav-tab active" data-view="dashboard" id="tab-dash-btn">📊 Dashboard</button>
          <button class="nav-tab" data-view="mindmap" id="tab-map-btn">🗺️ Mind Map</button>
        </nav>

        <!-- Search -->
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-input-box" placeholder="Tìm khái niệm... (Big O, Hash, BFS...)">
        </div>

        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="vi">VI</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <!-- ======= Dashboard View (Chapter Grid) ======= -->
    <div class="dashboard-view">
      <!-- Cards rendered by app.js -->
    </div>

    <!-- ======= Workspace View (Chapter Detail – Split Layout) ======= -->
    <div class="workspace-view">
      <!-- Left Side Panel -->
      <div class="side-panel">
        <!-- Rendered by app.js -->
      </div>

      <!-- Right Main Workspace -->
      <div class="main-workspace">
        <!-- Tabs + Panels rendered by app.js -->
      </div>
    </div>

    <!-- ======= Mind Map View ======= -->
    <div class="mindmap-view">
      <!-- Rendered by app.js -->
    </div>

    <!-- ======= Footer ======= -->
    <footer class="app-footer">
      <p>Nguyễn Hữu Nhân - Terralogic (Graine Nguyen)</p>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="data.js"></script>
  <script src="simulators.js"></script>
  <script src="app.js"></script>

</body>
</html>
